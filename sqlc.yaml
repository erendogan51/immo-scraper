version: "2"
overrides:
  go:
    overrides:
      - go_type:
          import: "github.com/jackc/pgx-shopspring-decimal"
          package: "decimal"
          type: "Decimal"
          pointer: true
        db_type: "pg_catalog.numeric"
      - go_type:
          import: "github.com/jackc/pgx-shopspring-decimal"
          package: "decimal"
          type: "Decimal"
          pointer: true
        db_type: "pg_catalog.numeric"
        nullable: true
      - go_type:
          import: "github.com/jackc/pgx-shopspring-decimal"
          package: "decimal"
          type: "Decimal"
          pointer: true
        db_type: "pg_catalog.decimal"
      - go_type:
          import: "github.com/jackc/pgx-shopspring-decimal"
          package: "decimal"
          type: "Decimal"
          pointer: true
        db_type: "pg_catalog.decimal"
        nullable: true
      - db_type: "uuid"
        go_type: "github.com/google/uuid.UUID"
      - db_type: "uuid"
        go_type: "github.com/google/uuid.NullUUID"
        nullable: true
sql:
  - engine: "postgresql"
    queries: "./pkg/db/sql/queries"
    schema: "./pkg/db/sql/migrations"
    gen:
      go:
        emit_all_enum_values: true
        emit_prepared_queries: true
        emit_db_tags: true
        emit_json_tags: true
        emit_interface: false
        emit_exact_table_names: false
        emit_empty_slices: false
        emit_methods_with_db_argument: false
        sql_package: "pgx/v5"
        package: "db"
        out: "pkg/db/sql/db"
